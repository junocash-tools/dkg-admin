[package]
name = "dkg-admin"
version = "0.2.0"
edition = "2021"
publish = false

[dependencies]
age = "0.11.2"
anyhow = "1.0.101"
async-trait = "0.1.89"
aws-config = "1.8.13"
aws-sdk-kms = "1.99.0"
aws-sdk-s3 = "1.122.0"
base64 = "0.22.1"
bech32 = "0.11.0"
bytes = "1.11.1"
chacha20poly1305 = "0.10.1"
clap = { version = "4.5.57", features = ["derive"] }
f4jumble = "0.1.1"
ff = "0.13.1"
hex = "0.4.3"
http = "1.4.0"
libc = "0.2"
orchard = { version = "0.14.0", default-features = false, features = ["std"] }
postcard = { version = "1.1.3", features = ["use-std"] }
prost = "0.14.3"
rand = "0.8.5"
rand_chacha = "0.3.1"
rand_core = "0.6.4"
reddsa = { git = "https://github.com/ZcashFoundation/reddsa.git", rev = "155c1803cf4187ee4635377a9cf589a71ae5ebfa", features = ["frost"] }
sapling = { package = "sapling-crypto", version = "0.7.0", default-features = false }
rustls = { version = "0.23.36", default-features = false, features = ["ring"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["formatting", "serde"] }
tokio = { version = "1.49.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tonic = { version = "0.14.3", default-features = false, features = ["codegen", "tls-connect-info", "tls-ring", "transport"] }
tonic-prost = "0.14.3"
tower = { version = "0.5.3", features = ["limit", "util"] }
tracing = "0.1.44"
transparent = { package = "zcash_transparent", version = "0.8.0", default-features = false, features = ["transparent-inputs"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
uuid = { version = "1.18.1", features = ["std"] }
zcash_note_encryption = "0.4.1"
zcash_primitives = { version = "0.28.0", default-features = false, features = ["std", "transparent-inputs"] }
zcash_protocol = { version = "0.9.0", default-features = false }
zeroize = { version = "1.8.2", features = ["zeroize_derive"] }

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.3"

[dev-dependencies]
rcgen = "0.13.2"
tempfile = "3.22.0"

[patch.crates-io]
zcash_protocol = { git = "https://github.com/juno-cash/junocash.git", rev = "786b64fc6c42cc77964565dd7ba81496fa74be81", package = "zcash_protocol" }
